{{- if and (not .Values.credentials.existingSecret) .Values.credentials.secretData }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quark.fullname" . }}-credentials
  labels:
    {{- include "quark.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.credentials.secretData | nindent 2 }}
{{- end }}
